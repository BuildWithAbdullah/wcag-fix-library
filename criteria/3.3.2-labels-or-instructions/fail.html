<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>3.3.2 failing patterns</title>
  <style>body { font-family: system-ui, sans-serif; padding: 24px; }    .fake-input { display: block; border: 1px solid #767676; padding: 10px;
                  min-height: 1.4em; max-width: 24rem; }
  </style>
</head>
<body>
  <form>
    <!-- 1. Placeholder used as the label. It disappears the moment the user
         types, so anyone who is interrupted has no way to recall what the
         field was for. Its default contrast also fails 1.4.3. -->
    <p><input type="email" placeholder="Email address"></p>

    <!-- 2. A label that is not associated with anything. The for attribute
         and the id do not match, so the association does not exist. -->
    <p>
      <label for="phone-number">Phone</label>
      <input type="tel" id="phone">
    </p>

    <!-- 3. A required field marked only with a red asterisk, with no
         explanation of what the asterisk means and no programmatic required
         state. -->
    <p>
      <label for="pc">Postcode <span style="color:#c00">*</span></label>
      <input type="text" id="pc">
    </p>

    <!-- 4. A format constraint that is only revealed after submission fails. -->
    <p>
      <label for="dob">Date of birth</label>
      <input type="text" id="dob">
    </p>

    <!-- 5. A select with no label at all. -->
    <p>
      <select>
        <option>Standard delivery</option>
        <option>Express delivery</option>
      </select>
    </p>

    <!-- 6. Two labels on one field. A theme adds one, a plugin adds the
         other, and the result is a control whose accessible name is one of
         the two with nothing in the markup saying which. The page looks
         right. -->
    <p>
      <label for="company">Company</label>
      <input type="text" id="company">
      <label for="company">Optional</label>
    </p>

    <!-- 7. A text field built out of a div with an ARIA role and no name at
         all. Rich text editors and search widgets arrive like this, and the
         role is enough to make a screen reader announce it as an edit field
         while giving the user nothing to tell them what it edits. -->
    <p>
      <span role="textbox" contenteditable="true" class="fake-input"></span>
    </p>

    <button type="submit">Continue</button>
  </form>
</body>
</html>

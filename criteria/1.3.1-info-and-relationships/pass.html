<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>1.3.1 corrected patterns</title>
  <style>
    h2 { font-size: 1.6rem; font-weight: 700; margin: 1.2em 0 .4em; }
    .nav-row { display: flex; gap: 1rem; list-style: none; padding: 0; }
    fieldset { border: 1px solid #767676; }
  </style>
</head>
<body>
  <!-- 1. A real heading. The visual result is identical; the structure is not.
       Style the element you mean, do not mean the element you styled. -->
  <h2>Shipping and returns</h2>
  <p>Orders are dispatched within two working days.</p>

  <!-- 2. A real list. Flex layout works exactly the same on li elements. -->
  <ul class="nav-row">
    <li><a href="/delivery">Delivery</a></li>
    <li><a href="/returns">Returns</a></li>
    <li><a href="/contact">Contact</a></li>
  </ul>

  <!-- 3. Header cells declared, with an explicit scope so the association
       holds in every direction. A caption names the table. -->
  <table>
    <caption>Size guide, measurements in centimetres</caption>
    <thead>
      <tr>
        <th scope="col">Size</th>
        <th scope="col">Chest</th>
        <th scope="col">Length</th>
      </tr>
    </thead>
    <tbody>
      <tr><th scope="row">S</th><td>96 cm</td><td>68 cm</td></tr>
      <tr><th scope="row">M</th><td>101 cm</td><td>70 cm</td></tr>
    </tbody>
  </table>

  <!-- 4. The group and its question are now programmatic. A screen reader
       announces the legend when focus enters the group. -->
  <fieldset>
    <legend>Delivery speed</legend>
    <label><input type="radio" name="speed" value="std"> Standard</label>
    <label><input type="radio" name="speed" value="exp"> Express</label>
  </fieldset>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>2.1.1 failing patterns</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; }
    .fake-btn { display: inline-block; background: #1a1a1a; color: #fff;
                padding: 10px 18px; cursor: pointer; }
    .swatch { width: 32px; height: 32px; display: inline-block; border: 1px solid #767676; cursor: pointer; }
  </style>
</head>
<body>
  <!-- 1. A div with a click handler. Not focusable, no role, no key handling.
       A mouse user sees a button. A keyboard user cannot reach it at all. -->
  <div class="fake-btn" onclick="alert('added')">Add to basket</div>

  <!-- 2. An anchor with no href. Without href an anchor is not focusable and
       is not exposed as a link. This is the single most common way a
       "working" navigation item becomes unreachable. -->
  <a onclick="alert('menu')">Open menu</a>

  <!-- 3. Colour swatches built from spans. Mouse-only selection. -->
  <p>Colour</p>
  <span class="swatch" style="background:#8b1e3f" onclick="alert('red')"></span>
  <span class="swatch" style="background:#1e3f8b" onclick="alert('blue')"></span>

  <!-- 4. tabindex used to force an order, which breaks the natural order for
       every element on the page that does not have it. -->
  <input type="text" tabindex="3" aria-label="Last name">
  <input type="text" tabindex="1" aria-label="First name">
</body>
</html>

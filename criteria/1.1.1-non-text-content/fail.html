<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>1.1.1 failing patterns</title>
  <style>
    .hero { width: 320px; height: 120px; background: #444 url(hero.jpg) center/cover; }
  </style>
</head>
<body>
  <h1>Product</h1>

  <!-- 1. Informative image with no text alternative at all. -->
  <img src="chart-q3.png" width="400" height="220">

  <!-- 2. Alt text that describes the file, not the content. A screen reader
       user hears "chart q3 dot png" and learns nothing. -->
  <img src="chart-q3.png" alt="chart-q3.png" width="400" height="220">

  <!-- 3. Decorative divider carrying an alt value. It adds noise to the
       reading order for no benefit. -->
  <img src="divider.svg" alt="divider" width="600" height="8">

  <!-- 4. Icon-only control with no accessible name. Announced as "button". -->
  <button type="button">
    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2"/>
    </svg>
  </button>

  <!-- 5. SVG given an image role but no name. -->
  <svg role="img" width="32" height="32" viewBox="0 0 32 32">
    <circle cx="16" cy="16" r="15" fill="#444"/>
  </svg>

  <!-- 6. An image button with no alt. The alt on input type="image" is the
       button's label, not a description of the picture, so without it the
       control is announced as "Submit button" at best and as the file name at
       worst. It survives in old checkout templates because it still submits
       perfectly well with a mouse. -->
  <form action="/search">
    <input type="text" aria-label="Search">
    <input type="image" src="search.png" width="32" height="32">
  </form>

  <!-- 7. A picture delivered as a CSS background with an image role bolted
       on. role="img" makes it an image to assistive technology, and an image
       needs a name; the role on its own only changes how loudly it is
       announced as unnamed. This is what a background-image carrying content
       turns into when somebody is told to add a role. -->
  <div role="img" class="hero"></div>
</body>
</html>

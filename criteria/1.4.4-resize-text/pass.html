<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Zoom left to the user. There is no legitimate reason to cap it. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1.4.4 corrected pattern</title>
  <style>
    /* min-height lets the box grow with its text instead of clipping it. */
    .promo { min-height: 48px; font-size: 1rem; }
  </style>
</head>
<body>
  <div class="promo">Free shipping on orders over 50. Ends Sunday.</div>
</body>
</html>

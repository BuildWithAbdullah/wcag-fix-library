<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>1.4.11 corrected patterns</title>
  <style>
    body { background: #fff; font-family: system-ui, sans-serif; padding: 24px; }

    /* 1. #767676 on white is 4.5:1, comfortably past the 3:1 this criterion
          asks for on a control boundary. */
    .field { border: 1px solid #767676; padding: 10px; font-size: 16px; }

    /* 2. Same treatment for the ghost button outline. The visual weight
          barely changes; the boundary becomes perceivable. */
    .btn-ghost { background: #fff; color: #1a1a1a; border: 1px solid #767676;
                 padding: 10px 18px; font-size: 16px; }

    /* 3. A meaningful icon is graphical content and needs 3:1. #b35c00 on
          white is 4.72:1 and still reads as an amber warning.

          This comment said 4.6 until test/contrast.test.mjs was written and
          the figure was asserted. A ratio quoted in a comment that nothing
          checks is a ratio that is eventually wrong. */
    .icon-warn { color: #b35c00; }

    /* 4. The toggle states differ by more than fill: the on state carries a
          3:1 fill and the knob moves, so state is not colour alone. */
    .toggle { width: 44px; height: 24px; border-radius: 12px; display: inline-block;
              position: relative; border: 1px solid #767676; }
    .toggle::after { content: ""; position: absolute; top: 3px; left: 3px;
              width: 16px; height: 16px; border-radius: 50%; background: #1a1a1a; }
    .toggle-on { background: #0b6b3a; }
    .toggle-on::after { left: auto; right: 3px; background: #ffffff; }
      .on-gradient { display: inline-block; padding: 20px;
                   background: linear-gradient(90deg, #0b3a6b, #6b0b3a); }
    .btn-over { background: transparent; color: #fff; border: 2px solid #fff;
                padding: 10px 18px; font-size: 16px; }
  </style>
</head>
<body>
  <label for="email">Email address</label><br>
  <input class="field" id="email" type="email"><br><br>

  <button class="btn-ghost" type="button">Save for later</button>

  <p>
    <svg class="icon-warn" width="24" height="24" viewBox="0 0 24 24" role="img" aria-label="Warning">
      <path d="M12 2 L22 20 H2 Z" fill="currentColor"/>
    </svg>
    Stock is low
  </p>

  <span class="toggle"></span> <span class="toggle toggle-on"></span>

  <!-- 5. A control sitting on a gradient. This one is here to be
       unjudgeable, and it is left in deliberately.

       A boundary has to reach 3:1 against the colours next to it, and on a
       gradient there is no single colour next to it: the ratio at one end of
       this button is not the ratio at the other. A tool that samples one
       pixel and prints a figure is printing the figure for that pixel. This
       repository's own judging refuses the measurement and says which
       element it refused, and tools/catalogue.mjs records that refusal as a
       limit observed on a corrected page, so the README's claim about what
       is not checked is asserted rather than merely written down.

       The boundary itself is correct. A white border is past 3:1 against
       every stop in this gradient, which was checked against the two
       extremes by hand rather than by the script. -->
  <p>
    <span class="on-gradient">
      <button class="btn-over" type="button">Apply offer</button>
    </span>
  </p>
</body>
</html>

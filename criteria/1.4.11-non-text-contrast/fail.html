<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>1.4.11 failing patterns</title>
  <style>
    body { background: #fff; font-family: system-ui, sans-serif; padding: 24px; }

    /* 1. Input border at #dddddd on white is 1.3:1. The field's boundary is
          effectively invisible, so the user cannot see where to type. Note
          that the label and the typed text pass 1.4.3 perfectly. */
    .field { border: 1px solid #ddd; padding: 10px; font-size: 16px; }

    /* 2. A secondary "ghost" button whose only boundary is a pale outline. */
    .btn-ghost { background: #fff; color: #1a1a1a; border: 1px solid #e2e2e2;
                 padding: 10px 18px; font-size: 16px; }

    /* 3. A meaningful icon drawn in a tint that fails against the page. */
    .icon-warn { color: #ffd9a0; }

    /* 4. A toggle whose on and off states are distinguished only by a fill
          that does not reach 3:1 against the track. */
    .toggle-off { background: #ececec; width: 44px; height: 24px; border-radius: 12px; display: inline-block; }
    .toggle-on  { background: #f5f5f5; width: 44px; height: 24px; border-radius: 12px; display: inline-block; }
  </style>
</head>
<body>
  <label for="email">Email address</label><br>
  <input class="field" id="email" type="email"><br><br>

  <button class="btn-ghost" type="button">Save for later</button>

  <p>
    <svg class="icon-warn" width="24" height="24" viewBox="0 0 24 24" role="img" aria-label="Warning">
      <path d="M12 2 L22 20 H2 Z" fill="currentColor"/>
    </svg>
    Stock is low
  </p>

  <span class="toggle-off"></span> <span class="toggle-on"></span>
</body>
</html>

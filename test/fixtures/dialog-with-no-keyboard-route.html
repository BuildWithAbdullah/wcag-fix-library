<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fixture: dialog with no keyboard route in</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; }
    .modal { position: fixed; inset: 20% 20%; background: #fff;
             border: 2px solid #1a1a1a; padding: 24px; display: none; }
    .modal[data-open] { display: block; }
    .opener { display: inline-block; background: #1a1a1a; color: #fff; padding: 10px 18px; }
  </style>
</head>
<body>
  <h1>Fixture</h1>

  <!-- The only way to open this dialog is a click on a div that cannot take
       focus, so there is no keyboard route in at all. The audit reports that
       it judged nothing about the dialog rather than reporting the dialog as
       correct, which is the answer a tool reaches when it cannot get in and
       counts silence as a pass. The unreachable opener itself is a 2.1.1
       failure and is reported there. -->
  <div class="opener" onclick="document.getElementById('m').setAttribute('data-open','')">
    Open terms
  </div>

  <div class="modal" role="dialog" aria-label="Terms" id="m">
    <p>Terms and conditions.</p>
    <button type="button" onclick="document.getElementById('m').removeAttribute('data-open')">
      Close
    </button>
  </div>
</body>
</html>
